<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPSC Mock Interview Registration | UPSC Academia Pune</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="mpsc-reg-page">
  <!-- Header will be injected -->
  <div id="site-header"></div>

  <section class="registration-container">
    <h1 class="page-title">MPSC Mock Interview Registration</h1>
    <div class="step-section" id="verifySection">
      <h2>Step 1: Verify Your Roll Number</h2>
      <input type="text" id="verifyMpscRoll" placeholder="Enter Roll Number" class="input-field" />
      <button id="verifyMpscBtn" class="btn primary">Verify Roll No</button>
      <div id="verifyMpscMessage" class="inline-message"></div>
    </div>
    <div class="step-section" id="registrationSection" style="display:none;">
      <h2>Step 2: Confirm Your Details</h2>
      <form id="mpscRegForm">
        <label>Name</label>
        <input type="text" id="regMpscName" readonly class="input-field" />
        <label>Category</label>
        <input type="text" id="regMpscCategory" readonly class="input-field" />
        <label>WhatsApp Number</label>
        <input type="text" id="regMpscWhatsapp" placeholder="Enter WhatsApp Number" class="input-field" />
        <label>Email</label>
        <input type="email" id="regMpscEmail" placeholder="Enter Email" class="input-field" />
        <button type="submit" id="regMpscSubmitBtn" class="btn primary">Submit Registration</button>
        <div id="regMpscMessage" class="inline-message"></div>
      </form>
    </div>
    <div class="step-section" id="successSection" style="display:none;">
      <h2>✅ Registration Successful!</h2>
      <p>Thank you for registering for the MPSC Mock Interview.</p>
      <a href="https://whatsapp.com/channel/0029Va68o511noz2AiJ8TV1g" class="btn secondary" target="_blank">Join Our Official WhatsApp Channel</a>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
